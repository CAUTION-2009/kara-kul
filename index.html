<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кара-Көл Market - Башкы бет</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="customToast" class="custom-toast">Шилтеме көчүрүлдү!</div>

  <div class="share-modal-overlay" id="shareModalOverlay" onclick="closeShareModal()">
      <div class="share-modal" onclick="event.stopPropagation()">
          <div class="share-modal-header">
              <h3 id="shareModalTitle">Толук шилтеме</h3>
              <i class="fas fa-times" onclick="closeShareModal()"></i>
          </div>
          <div class="share-modal-body">
              <div class="share-input-wrap" id="shareLinkContainer">Дарек бул жерге чыгат...</div>
          </div>
          <div class="share-modal-footer">
              <button class="share-copy-btn" id="shareCopyBtn" onclick="executeCopy()">Көчүрүү</button>
          </div>
      </div>
  </div>

  <div class="sidebar" id="sidebar">
     <div class="sidebar-header">
      <h2 style=" margin: 0; font-size: 1.2rem; color:#ff0000;">Меню</h2>
      <i class="fas fa-times" onclick="toggleMenu()" style="cursor:pointer; font-size:1.2rem; color:#888;"></i>
    </div>
    <div class="sidebar-links">
      <a href="index.html"><i class="fas fa-home"></i> Башкы бет</a>
      <a href="categories.html"><i class="fas fa-th-large"></i> Категориялар</a>
      <a href="jardama.html"><i class="fas fa-plus-circle"></i> Жарнама кошуу</a>
      <a href="#" onclick="shareMainSite(event)"><i class="fas fa-share-alt"></i> Бөлүшүү</a>
      <a href="feedback.html"><i class="fas fa-comment-dots"></i> Ой пикир</a>
    </div>
  </div>
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <div class="ad-overlay" id="adOverlay" onclick="closeAdDetails()"></div>
  <div class="ad-modal-window" id="adModal"></div>

  <div class="header">
      <div class="header-top">
          <i class="fas fa-bars" onclick="toggleMenu()" style="font-size: 1.3rem; cursor: pointer;"></i>
          <h2>Кара-Көл Маркет</h2>
          <a href="admin.html" class="admin-btn">
            <i class="fas fa-user-shield"></i> Админ
          </a>
      </div>
      
      <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Жарнамаларды издөө...">
      </div>
  </div>

<div class="section-title">Категориялар</div>
<div class="categories-container">
    <button class="cat-item active" onclick="filterAds('all', this)">
        <div class="cat-icon-wrap"><i class="fas fa-th-large"></i></div>
        <span>Баардыгы</span>
    </button>
    <button class="cat-item" onclick="filterAds('news', this)">
        <div class="cat-icon-wrap"><i class="fas fa-bullhorn"></i></div>
        <span>Кабарлар</span>
    </button>
    <button class="cat-item" onclick="filterAds('auto', this)">
        <div class="cat-icon-wrap"><i class="fas fa-car"></i></div>
        <span>Автоунаа</span>
    </button>
    <button class="cat-item" onclick="filterAds('house', this)">
        <div class="cat-icon-wrap"><i class="fas fa-home"></i></div>
        <span>Кыймылсыз мүлк</span>
    </button>
    <button class="cat-item" onclick="filterAds('phone', this)">
        <div class="cat-icon-wrap"><i class="fas fa-mobile-alt"></i></div>
        <span>Телефондор</span>
    </button>
    <button class="cat-item" onclick="filterAds('construction', this)">
        <div class="cat-icon-wrap"><i class="fas fa-tools"></i></div>
        <span>Курулуш</span>
    </button>
    <button class="cat-item" onclick="filterAds('job', this)">
        <div class="cat-icon-wrap"><i class="fas fa-briefcase"></i></div>
        <span>Жумуш</span>
    </button>
    <button class="cat-item" onclick="filterAds('food', this)">
        <div class="cat-icon-wrap"><i class="fas fa-utensils"></i></div>
        <span>Тамак-аш</span>
    </button>
    <button class="cat-item" onclick="filterAds('tech', this)">
        <div class="cat-icon-wrap"><i class="fas fa-laptop"></i></div>
        <span>Техника</span>
    </button>
    <button class="cat-item" onclick="filterAds('farm', this)">
        <div class="cat-icon-wrap"><i class="fas fa-seedling"></i></div>
        <span>Дыйкан-чарба</span>
    </button>
    <button class="cat-item" onclick="filterAds('livestock', this)">
        <div class="cat-icon-wrap"><i class="fas fa-paw"></i></div>
        <span>Мал чарба</span>
    </button>
    <button class="cat-item" onclick="filterAds('sport', this)">
        <div class="cat-icon-wrap"><i class="fas fa-running"></i></div>
        <span>Спорт</span>
    </button>
    <button class="cat-item" onclick="filterAds('game', this)">
        <div class="cat-icon-wrap"><i class="fas fa-gamepad"></i></div>
        <span>Оюн</span>
    </button>
    <button class="cat-item" onclick="filterAds('taxi', this)">
        <div class="cat-icon-wrap"><i class="fas fa-taxi"></i></div>
        <span>Такси</span>
    </button>
    <button class="cat-item" onclick="filterAds('fuel', this)">
        <div class="cat-icon-wrap"><i class="fas fa-fire"></i></div>
        <span>Отун, көмүр</span>
    </button>
    <button class="cat-item" onclick="filterAds('clothes', this)">
        <div class="cat-icon-wrap"><i class="fas fa-tshirt"></i></div>
        <span>Кийим</span>
    </button>
    <button class="cat-item" onclick="filterAds('kitchen', this)">
        <div class="cat-icon-wrap"><i class="fas fa-coffee"></i></div>
        <span>Ашкана</span>
    </button>
    <button class="cat-item" onclick="filterAds('tools', this)">
        <div class="cat-icon-wrap"><i class="fas fa-wrench"></i></div>
        <span>Аспаптар</span>
    </button>
    <button class="cat-item" onclick="filterAds('beauty', this)">
        <div class="cat-icon-wrap"><i class="fas fa-magic"></i></div>
        <span>Сулуулук</span>
    </button>
    <button class="cat-item" onclick="filterAds('furniture', this)">
        <div class="cat-icon-wrap"><i class="fas fa-couch"></i></div>
        <span>Табылга</span>
    </button>
    <button class="cat-item" onclick="filterAds('charity', this)">
        <div class="cat-icon-wrap"><i class="fas fa-hand-holding-heart"></i></div>
        <span>Кайрымдуулук</span>
    </button>
</div>

  <div class="section-title">Акыркы жарнамалар</div>
  <div class="ads-container" id="adsList">
    <p id="noAdsText" style="grid-column: 1/-1; text-align: center; color: #999; padding: 20px;">Жарнамалар жүктөлүүдө...</p>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-link active"><i class="fas fa-home"></i>Башкы</a>
    <a href="categories.html" class="nav-link"><i class="fas fa-th-large"></i>Бөлүмдөр</a>
    <a href="jardama.html" class="nav-link center-add"><i class="fas fa-plus"></i></a>
    <a href="Bank.html" class="nav-link"><i class="fas fa-university"></i>Банк</a>
    <a href="weather.html" class="nav-link"><i class="fas fa-cloud-sun"></i>Аба ырайы</a>
  </div>

<script type="module" src="uluk.js"></script>
</body>
</html>
