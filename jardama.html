
<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жарнама берүү</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>

  <!-- КАТТАЛУУ ОВЕРЛЕЙ (Google Sign-In) -->
  <div class="login-overlay" id="authOverlay">
    <div class="login-box">
      <h2><i class="fas fa-user-circle" style="color: #ff4d4d;"></i> Каттоо</h2>
      <p style="color: #666; font-size: 14px; margin: 10px 0;">Жарнама берүү үчүн Google аккаунтуңуз аркылуу кириңиз</p>

      <button class="google-signin-btn" id="googleSignInBtn">
        <img src="https://www.google.com/favicon.ico" alt="Google" style="width: 18px; height: 18px;">
        Google аркылуу кириңиз
      </button>

      <div class="error-msg" id="authError" style="margin-top: 10px;"></div>
    </div>
  </div>

  <div class="header">
    <a href="index.html"><i class="fas fa-arrow-left"></i></a>
    <h2 style="margin:0; font-size: 1.1rem;">Жарнама кошуу</h2>
  </div>

  <div class="container">
    <div class="form-card">
      <!-- Колдонуучу маалыматы -->
      <div id="userInfo" style="display: none; background: #f0f8ff; border: 1px solid #b0d4f1; border-radius: 10px; padding: 12px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
        <img id="userPhoto" src="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
        <div style="flex: 1;">
          <div id="userName" style="font-weight: bold; font-size: 14px; color: #333;"></div>
          <div id="userEmail" style="font-size: 12px; color: #666;"></div>
        </div>
        <button onclick="signOutUser()" style="background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 12px;"><i class="fas fa-sign-out-alt"></i> Чыгуу</button>
      </div>

      <textarea id="adText" placeholder="Жарнаманын сүрөттөмөсү..." rows="4"></textarea>

      <select id="adCat">
        <option value="none">Категория тандаңыз</option>
        <option value="auto">Автоунаа</option>
        <option value="phone">Телефондор</option>
        <option value="house">Кыймылсыз мүлк</option>
        <option value="construction">Курулуш материалдар</option>
        <option value="job">Жумуш</option>
        <option value="food">Тамак-аш</option>
        <option value="tech">Техника</option>
        <option value="farm">Дыйкан-чарба</option>
        <option value="livestock">Мал чарба</option>
        <option value="sport">Спорт</option>
        <option value="game">Киберспорт</option>
        <option value="taxi">Такси</option>
        <option value="fuel">Отун, көмүр</option>
        <option value="kitchen">Кофе, Ашкана</option>
        <option value="tools">Аспаптар</option>
        <option value="beauty">Сулуулук</option>
        <option value="charity">Кайрымдуулук</option>
      </select>

      <div class="row">
        <input type="number" id="adPrice" placeholder="Баасы">
        <select id="adValuta" style="width: 100px;"><option>Сом</option><option>$</option></select>
      </div>

      <input type="tel" id="adPhone" placeholder="Телефон номериңиз (мис: 0700123456)">
      <div id="phoneError" class="phone-error-msg">Сураныч, туура уюлдук номер киргизиңиз!</div>

      <p style="font-size: 12px; color: #777; margin-top: 15px;">Сүрөттөр (5ке чейин, 1-сүрөт башкы бетте көрүнөт):</p>
      <div class="upload-grid">
        <label class="upload-box"><i class="fas fa-camera"></i><span>Башкы</span><input type="file" id="p1" accept="image/*" hidden onchange="prev(this, 1)"><img id="img1"></label>
        <label class="upload-box"><i class="fas fa-plus"></i><span>Сүрөт 2</span><input type="file" id="p2" accept="image/*" hidden onchange="prev(this, 2)"><img id="img2"></label>
        <label class="upload-box"><i class="fas fa-plus"></i><span>Сүрөт 3</span><input type="file" id="p3" accept="image/*" hidden onchange="prev(this, 3)"><img id="img3"></label>
        <label class="upload-box"><i class="fas fa-plus"></i><span>Сүрөт 4</span><input type="file" id="p4" accept="image/*" hidden onchange="prev(this, 4)"><img id="img4"></label>
        <label class="upload-box"><i class="fas fa-plus"></i><span>Сүрөт 5</span><input type="file" id="p5" accept="image/*" hidden onchange="prev(this, 5)"><img id="img5"></label>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="sendAd()">
        <i class="fas fa-paper-plane"></i> <span id="btnText">Жарнаманы жайгаштыруу</span>
      </button>
    </div>
  </div>

<script type="module" src="jardama.js"></script>
</body>
</html>
