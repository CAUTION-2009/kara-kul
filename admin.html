<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ Панель - Кара-Көл Market</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2><i class="fas fa-user-shield" style="color: #ff4d4d;"></i> Админ Кирүү</h2>
      <div class="error-msg" id="errorMsg">Пароль ката! Кайра аракет кылыңыз.</div>
      
      <div class="password-wrapper">
        <input type="password" id="passwordInput" placeholder="Админ паролду жазыңыз" autofocus>
        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
      </div>

      <button id="loginBtn">Кирүү</button>
    </div>
  </div>

  <div class="header">
    <i class="fas fa-user-shield"></i> Башкаруу Панели (Админ)
  </div>

  <div class="container" id="adminContainer">
    <div class="counter">
      <span id="counterText">Жүктөлүүдө...</span>
      <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Чыгуу</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabPending">Күтүүдөгүлөр</button>
      <button class="tab-btn" id="tabActive">Сайттагылар</button>
      <button class="tab-btn" id="tabFeedbacks">Ой-пикирлер</button>
    </div>

    <div id="loading" class="loading"><i class="fas fa-spinner fa-spin"></i> Жүктөлүүдө...</div>
    
    <div id="ads-container"></div>
    
    <div id="feedbacks-container"></div>
  </div>
<script type="module" src="admin.js">
  </script>
</body>
</html>
