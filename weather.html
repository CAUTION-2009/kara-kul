<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аба Ырайы - Кара-Көл Маркет</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h2>Кара-Көл шаарынын Аба Ырайы</h2>
  </div>

  <div class="maintenance-notice">
    <i class="fas fa-tools"></i>
    <p class="maintenance-text">
      <strong>Урматтуу колдонуучу!</strong>
      Аба ырайы бөлүмү учурда толук иштелип чыгууда. Кээ бир маалыматтар так эмес. Сабырдуулугуңуз үчүн рахмат!
    </p>
  </div>

  <div class="weather-card">
    <p class="city-name"><i class="fas fa-map-marker-alt"></i> Кара-Көл шаары</p>
    <div class="temp-big" id="current-temp">--°C</div>
    <div class="weather-desc" id="weather-status">Жүктөлүүдө...</div>
    
    <div class="weather-details">
      <div class="w-det-box">
        <i class="fas fa-wind"></i><br>
        <span>Шамал: </span><strong id="wind-speed">-- км/с</strong>
      </div>
      <div class="w-det-box">
        <i class="fas fa-tint"></i><br>
        <span>Нымдуулук: </span><strong id="humidity">--%</strong>
      </div>
    </div>
  </div>

  <div class="chart-container">
    <canvas id="weatherChart"></canvas>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-link"><i class="fas fa-home"></i>Башкы</a>
    <a href="categories.html" class="nav-link"><i class="fas fa-th-large"></i>Бөлүмдөр</a>
    <a href="jardama.html" class="nav-link center-add"><i class="fas fa-plus"></i></a>
    <a href="Bank.html" class="nav-link"><i class="fas fa-university"></i>Банк</a>
    <a href="weather.html" class="nav-link active"><i class="fas fa-cloud-sun"></i>Аба ырайы</a>
  </div>

  <script src="weather.js"></script>
</body>
</html>
