<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Валюта Курстары - Кара-Көл Маркет</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h2>Акча Валюта Курстары (Айыл Банк деңгээлинде)</h2>
  </div>

  <div class="container">
    
    <div class="card">
      <div class="card-title"><i class="fas fa-university" style="color: #27ae60;"></i> Накталай Курстар (Кыргызстан банктары)</div>
      <table>
        <thead>
          <tr>
            <th>Валюта</th>
            <th style="text-align: right;">Алуу (Покупка)</th>
            <th style="text-align: right;">Сатуу (Продажа)</th>
          </tr>
        </thead>
        <tbody id="rates-table">
          <tr><td colspan="3" style="text-align: center; color: #aaa; padding: 20px;"><i class="fas fa-spinner fa-spin"></i> Интернеттен жүктөлүүдө...</td></tr>
        </tbody>
      </table>
      <div class="update-time" id="sync-clock">Курстар автоматтык түрдө жаңыланат...</div>
    </div>

    <div class="card">
      <div class="card-title"><i class="fas fa-calculator" style="color: #3498db;"></i> Валюта Конвертери</div>
      <div class="converter-group">
        <div class="input-box">
          <input type="number" id="inputAmount" value="100">
          <select id="fromCurrency">
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="RUB">RUB (₽)</option>
            <option value="KZT">KZT (₸)</option>
          </select>
        </div>
        <div style="text-align: center; color: #7f8c8d; font-size: 1.2rem;"><i class="fas fa-exchange-alt fa-rotate-90"></i></div>
        <div class="input-box">
          <input type="number" id="outputAmount" readonly style="color: #27ae60;">
          <select id="toCurrency" disabled>
            <option value="KGS">KGS (сом)</option>
          </select>
        </div>
      </div>
    </div>

  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-link"><i class="fas fa-home"></i>Башкы</a>
    <a href="categories.html" class="nav-link"><i class="fas fa-th-large"></i>Бөлүмдөр</a>
    <a href="jardama.html" class="nav-link center-add"><i class="fas fa-plus"></i></a>
    <a href="Bank.html" class="nav-link active"><i class="fas fa-university"></i>Банк</a>
    <a href="weather.html" class="nav-link"><i class="fas fa-cloud-sun"></i>Аба ырайы</a>
  </div>

  <script src="Bank.js"></script>
</body>
</html>
